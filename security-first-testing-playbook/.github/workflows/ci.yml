# Pipeline gates (slide 36): what blocks, what only warns.
#
# Third-party actions are pinned to full commit SHAs, not tags — a tag is
# mutable, so pinning to one means trusting whoever can move it. The comment
# after each SHA records the tag it corresponded to when it was pinned.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 2 * * *"   # nightly: the expensive suites that must not gate a PR

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: PR gate (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install from a clean checkout
        run: python -m pip install -e ".[dev]"

      - name: Lint and format (blocking, zero warnings)
        run: |
          ruff check src tests
          ruff format --check src tests

      - name: Type check (blocking)
        run: mypy

      - name: Test suite — no Docker, no network (blocking)
        run: pytest --cov --cov-report=term-missing

      - name: Assertion-free test audit (blocking)
        run: python -m stplaybook.quality.cli audit tests --show-weak

  supply-chain:
    name: SBOM and provenance
    runs-on: ubuntu-latest
    needs: gate
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install with the sbom extra
        run: python -m pip install -e ".[dev,sbom]"

      - name: Generate the SBOM at build time
        run: cyclonedx-py environment -o sbom.cdx.json

      - name: Verify the SBOM is readable by our own parser
        run: |
          python - <<'PY'
          from pathlib import Path
          from stplaybook.security.sbom import load_sbom
          sbom = load_sbom(Path("sbom.cdx.json"))
          print(f"CycloneDX {sbom.spec_version}: {len(sbom.components)} components")
          forbidden = sbom.forbidden_licences(frozenset({"AGPL-3.0-only"}))
          if forbidden:
              raise SystemExit(f"forbidden licence: {[c.coordinate for c in forbidden]}")
          PY

      - name: Publish the component inventory to the job summary
        run: |
          {
            echo "### SBOM"
            echo ""
            python -c "
          from pathlib import Path
          from stplaybook.security.sbom import load_sbom
          for c in load_sbom(Path('sbom.cdx.json')).components:
              print(f'- {c.coordinate}')
          "
          } >> "$GITHUB_STEP_SUMMARY"

  nightly:
    name: Nightly (reported, never blocking)
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install with the mutation extra
        run: python -m pip install -e ".[dev,mutation]"

      - name: Mutation testing (slide 19 — expensive by construction)
        run: mutmut run --paths-to-mutate src/stplaybook || true

      - name: Mutation results
        run: mutmut results || true
